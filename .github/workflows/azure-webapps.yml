name: Build and deploy to Azure App Service

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: yartey-portfolio
  PYTHON_VERSION: '3.12'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Smoke test the app
        run: |
          python - <<'PY'
          from app import app

          client = app.test_client()
          for path in ("/", "/education.html", "/experience.html", "/projects.html",
                       "/certifications.html", "/contact.html", "/projects",
                       "/assets/css/style.css", "/assets/js/main.js", "/healthz"):
              response = client.get(path)
              assert response.status_code == 200, f"{path} returned {response.status_code}"
              print(f"ok {path}")

          assert client.get("/does-not-exist").status_code == 404
          print("ok 404 handling")
          PY

      - name: Package for deployment
        run: zip -r release.zip . -x '.git/*' '.github/*' '.venv/*' '*.pyc' '__pycache__/*'

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: release.zip

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: production
      url: ${{ steps.deploy.outputs.webapp-url }}
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: site

      - name: Unzip artifact
        run: unzip -q release.zip

      - name: Deploy to Azure App Service
        id: deploy
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
