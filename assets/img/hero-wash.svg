<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
  <defs>
    <linearGradient id="ribbon1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#19e3c0" stop-opacity=".85"/>
      <stop offset="1" stop-color="#7c5cff" stop-opacity=".15"/>
    </linearGradient>
    <linearGradient id="ribbon2" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9a7bff" stop-opacity=".8"/>
      <stop offset="1" stop-color="#19e3c0" stop-opacity=".12"/>
    </linearGradient>
    <linearGradient id="ribbon3" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#ffb457" stop-opacity=".55"/>
      <stop offset="1" stop-color="#7c5cff" stop-opacity=".08"/>
    </linearGradient>
    <filter id="soften" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
    <filter id="soften2" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>

  <!-- Broad silk ribbons, folding over one another. -->
  <g filter="url(#soften)">
    <path d="M-140 470c210-190 420-250 640-180s360 60 520-70c110-90 200-150 300-170v420c-120 30-230 90-350 150s-280 90-430 40-300-150-450-140-160 40-230 90z"
          fill="url(#ribbon1)" opacity=".55"/>
    <path d="M-120 690c180-120 330-140 500-90s330 120 490 60 300-190 470-230v560H-120z"
          fill="url(#ribbon2)" opacity=".45"/>
  </g>

  <g filter="url(#soften2)" opacity=".5">
    <path d="M120 300c180-120 340-90 500 10s330 150 500 60"
          fill="none" stroke="url(#ribbon3)" stroke-width="90" stroke-linecap="round"/>
    <path d="M-40 620c220-90 380-40 540 60s340 120 520 20"
          fill="none" stroke="url(#ribbon1)" stroke-width="60" stroke-linecap="round"/>
  </g>

  <!-- A few soft motes for depth. -->
  <g>
    <circle cx="1180" cy="200" r="90" fill="#19e3c0" opacity=".14" filter="url(#soften2)"/>
    <circle cx="260" cy="700" r="120" fill="#9a7bff" opacity=".14" filter="url(#soften2)"/>
    <circle cx="820" cy="120" r="60" fill="#ffb457" opacity=".12" filter="url(#soften2)"/>
  </g>
</svg>
