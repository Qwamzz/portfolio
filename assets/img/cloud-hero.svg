<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 420" role="img" aria-label="Cloud architecture illustration">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1573c4"/>
      <stop offset="1" stop-color="#0d2c4b"/>
    </linearGradient>
  </defs>

  <circle cx="70" cy="60" r="6" fill="#7cc4f8" opacity=".7"/>
  <circle cx="470" cy="90" r="9" fill="#7cc4f8" opacity=".5"/>
  <circle cx="430" cy="40" r="4" fill="#1573c4" opacity=".7"/>
  <circle cx="120" cy="330" r="5" fill="#1573c4" opacity=".5"/>

  <!-- main cloud -->
  <g>
    <path d="M175 150c0-33 27-60 60-60 24 0 45 14 54 35 6-3 13-5 20-5 26 0 47 21 47 47 0 2 0 4-1 6 19 5 33 22 33 43 0 25-20 45-45 45H166c-30 0-55-25-55-55 0-28 21-51 49-55 5-1 10-1 15-1z" fill="url(#sky)"/>
    <path d="M235 175h60M215 200h100M255 225h60" stroke="#bfe3fb" stroke-width="9" stroke-linecap="round" opacity=".85"/>
  </g>

  <!-- connectors -->
  <g stroke="#1573c4" stroke-width="3" stroke-dasharray="7 8" fill="none" opacity=".65">
    <path d="M150 285v40h-40v20"/>
    <path d="M260 285v75"/>
    <path d="M370 285v40h40v20"/>
  </g>

  <!-- server racks -->
  <g>
    <rect x="60" y="345" width="100" height="60" rx="9" fill="#0d2c4b"/>
    <rect x="72" y="357" width="52" height="7" rx="3.5" fill="#7cc4f8"/>
    <rect x="72" y="372" width="70" height="7" rx="3.5" fill="#4aa8ee" opacity=".8"/>
    <circle cx="145" cy="391" r="5" fill="#57d38c"/>

    <rect x="210" y="360" width="100" height="45" rx="9" fill="#1573c4"/>
    <rect x="222" y="374" width="56" height="7" rx="3.5" fill="#e8f3fb" opacity=".9"/>
    <circle cx="295" cy="391" r="5" fill="#57d38c"/>

    <rect x="360" y="345" width="100" height="60" rx="9" fill="#0d2c4b"/>
    <rect x="372" y="357" width="60" height="7" rx="3.5" fill="#7cc4f8"/>
    <rect x="372" y="372" width="44" height="7" rx="3.5" fill="#4aa8ee" opacity=".8"/>
    <circle cx="445" cy="391" r="5" fill="#57d38c"/>
  </g>

  <!-- floating shield -->
  <g transform="translate(400 200)">
    <path d="M32 0 62 12v26c0 22-14 36-30 44-16-8-30-22-30-44V12z" fill="#7cc4f8"/>
    <path d="M20 40l9 10 17-20" stroke="#0d2c4b" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- floating code chip -->
  <g transform="translate(35 175)">
    <rect width="86" height="60" rx="10" fill="#0d2c4b"/>
    <path d="M28 22l-10 8 10 8M58 22l10 8-10 8M46 18l-6 24" stroke="#7cc4f8" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
