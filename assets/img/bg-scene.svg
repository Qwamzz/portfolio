<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
  <defs>
    <linearGradient id="l1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#19e3c0"/>
      <stop offset="1" stop-color="#7c5cff"/>
    </linearGradient>
    <linearGradient id="l2" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffb457"/>
      <stop offset="1" stop-color="#7c5cff"/>
    </linearGradient>
    <radialGradient id="r1">
      <stop offset="0" stop-color="#19e3c0" stop-opacity=".55"/>
      <stop offset="1" stop-color="#19e3c0" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- topographic contours, lower left -->
  <g fill="none" stroke="url(#l1)" stroke-width="1.6" opacity=".5">
    <path d="M-60 760c150-70 260-40 380 20s230 120 380 92 250-140 400-160 300 30 460 96"/>
    <path d="M-60 812c150-70 260-40 380 20s230 120 380 92 250-140 400-160 300 30 460 96"/>
    <path d="M-60 864c150-70 260-40 380 20s230 120 380 92 250-140 400-160 300 30 460 96"/>
    <path d="M-60 916c150-70 260-40 380 20s230 120 380 92 250-140 400-160 300 30 460 96"/>
    <path d="M-60 968c150-70 260-40 380 20s230 120 380 92 250-140 400-160 300 30 460 96"/>
  </g>

  <!-- topographic contours, upper right -->
  <g fill="none" stroke="url(#l2)" stroke-width="1.4" opacity=".42">
    <path d="M1660 60c-140 40-250 10-380-40s-240-90-360-40-190 160-330 176-260-40-380-104"/>
    <path d="M1660 116c-140 40-250 10-380-40s-240-90-360-40-190 160-330 176-260-40-380-104"/>
    <path d="M1660 172c-140 40-250 10-380-40s-240-90-360-40-190 160-330 176-260-40-380-104"/>
    <path d="M1660 228c-140 40-250 10-380-40s-240-90-360-40-190 160-330 176-260-40-380-104"/>
  </g>

  <!-- node constellation -->
  <g stroke="url(#l1)" stroke-width="1.3" opacity=".55" fill="none">
    <path d="M1180 380 1330 300 1450 400 1330 300 1300 170 1180 380 1060 470 1180 380M1450 400 1520 540 1330 300"/>
    <path d="M180 300 300 210 420 300 300 210 260 90 180 300 90 430 180 300M420 300 470 440 300 210"/>
  </g>
  <g fill="#19e3c0" opacity=".8">
    <circle cx="1180" cy="380" r="6"/><circle cx="1330" cy="300" r="8"/><circle cx="1450" cy="400" r="5"/>
    <circle cx="1300" cy="170" r="5"/><circle cx="1060" cy="470" r="7"/><circle cx="1520" cy="540" r="5"/>
    <circle cx="180" cy="300" r="6"/><circle cx="300" cy="210" r="8"/><circle cx="420" cy="300" r="5"/>
    <circle cx="260" cy="90" r="5"/><circle cx="90" cy="430" r="7"/><circle cx="470" cy="440" r="5"/>
  </g>

  <!-- soft glows -->
  <circle cx="1340" cy="300" r="230" fill="url(#r1)" opacity=".45"/>
  <circle cx="270" cy="250" r="200" fill="url(#r1)" opacity=".32"/>

  <!-- orbit rings, centre -->
  <g fill="none" stroke="url(#l1)" opacity=".28">
    <ellipse cx="800" cy="500" rx="330" ry="120" stroke-width="1.4"/>
    <ellipse cx="800" cy="500" rx="330" ry="120" stroke-width="1.4" transform="rotate(58 800 500)"/>
    <ellipse cx="800" cy="500" rx="330" ry="120" stroke-width="1.4" transform="rotate(-58 800 500)"/>
    <circle cx="800" cy="500" r="52" stroke-width="2"/>
  </g>
  <circle cx="800" cy="500" r="14" fill="#7c5cff" opacity=".5"/>
</svg>
